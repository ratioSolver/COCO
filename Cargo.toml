[package]
name = "coco-reasoner"
version = "0.1.0"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "Combined deduction and abduCtion (CoCo) reasoner is a dual-process inspired cognitive architecture built in Rust"
readme = "README.md"
repository = "https://github.com/ratioSolver/COCO"
license-file = "LICENSE.txt"

[lib]
name = "coco"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1.0", features = ["full"] }
rust-rule-engine = { version = "1.18.26" }
mongodb = { version = "3.5.0" }
