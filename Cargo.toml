[package]
name = "coco-reasoner"
version = "0.1.0"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "Combined deduction and abduCtion (CoCo) reasoner is a dual-process inspired cognitive architecture built in Rust"
readme = "README.md"
repository = "https://github.com/ratioSolver/COCO"
license-file = "LICENSE.txt"

[lib]
name = "coco"

[features]
default = ["mongodb", "clips", "fcm"]
mongodb = ["dep:mongodb"]
clips = ["dep:clips"]
ollama = ["dep:reqwest"]
server = ["dep:axum", "dep:tower-http", "dep:utoipa"]
fcm = ["dep:reqwest", "dep:yup-oauth2"]
mqtt = ["dep:rumqtt"]

[dependencies]
axum = { version = "0.8.8", features = ["ws"], optional = true }
tower-http = { version = "0.6.8", features = ["fs"], optional = true }
tokio = { version = "1.49", features = ["full"] }
serde = "1.0.228"
mongodb = { version = "3.5.1", optional = true }
futures = "0.3.31"
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["chrono"], optional = true }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["json"], optional = true }
yup-oauth2 = { version = "12.1.2", optional = true }
rumqtt = { version = "0.31.0", optional = true }
clips = { git = "https://github.com/ratioSolver/rust-clips", optional = true }
